set-option -g window-size latest
# tmux 3.6 initializes but does not add the session lock timer when this is
# zero, then asks libevent to delete the unattached timer on viewer activity.
# Keep the timer attached while retaining effectively-disabled auto-locking.
set-option -g lock-after-time 2147483647
# tmux remains the session owner, but its status line is duplicate chrome in a
# browser workspace and leaves another full-screen row to redraw on resize.
set-option -g status off
